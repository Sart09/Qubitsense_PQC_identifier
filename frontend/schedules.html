<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedules - Quantum Proof System Scanner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A6%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/components/pnb-theme.css">
    <style>
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-active {
            background: rgba(34, 197, 94, .15);
            color: #16a34a;
        }

        .badge-paused {
            background: rgba(100, 116, 139, .15);
            color: #475569;
        }

        .score-improve {
            color: #16a34a;
            font-weight: bold;
        }

        .score-worsen {
            color: #dc2626;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Navigation, the signed-in email and logout all come from the
         shared sidebar (components/sidebar.js) — this page carries no
         header of its own. -->
    <main class="max-w-6xl mx-auto px-6 py-8">
        <div class="pnb-hero flex items-center justify-between mb-8 mt-4 px-6 py-5">
            <div>
                <h1 class="pnb-shell-h1 text-3xl font-bold">Automated Scheduling</h1>
                <p class="pnb-shell-text-muted text-sm mt-1">Configure recurring post-quantum risk scans</p>
            </div>
            <button onclick="openCreateModal()" class="pnb-btn pnb-btn-ghost">
                + New Schedule
            </button>
        </div>

        <div class="pnb-card rounded-2xl overflow-hidden mb-8">
            <div class="overflow-x-auto">
                <table class="pnb-table w-full text-left">
                    <thead>
                        <tr class="text-sm">
                            <th class="p-4 font-semibold">Domain</th>
                            <th class="p-4 font-semibold">Frequency</th>
                            <th class="p-4 font-semibold">Status</th>
                            <th class="p-4 font-semibold">Last Scan</th>
                            <th class="p-4 font-semibold">Next Scan</th>
                            <th class="p-4 font-semibold">Risk Score</th>
                            <th class="p-4 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="schedulesTable" class="divide-y text-sm">
                        <tr>
                            <td colspan="7" class="p-8 text-center pnb-text-muted">Loading schedules...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Create Schedule Modal -->
    <div id="createModal" class="hidden pnb-modal-backdrop">
        <div class="pnb-modal-panel rounded-2xl w-[450px] shadow-2xl p-6">
            <div class="pnb-modal-header flex justify-between items-center border-b pb-3 mb-4">
                <h2 class="text-xl font-bold">Add Schedule</h2>
                <button onclick="closeCreateModal()" class="pnb-modal-close">&times;</button>
            </div>
            <form id="createForm">
                <div class="mb-4">
                    <label for="domain" class="pnb-label">Target Domain</label>
                    <input type="text" id="domain" required class="pnb-input" placeholder="example.com">
                </div>
                <div class="mb-4">
                    <label for="frequency" class="pnb-label">Frequency</label>
                    <select id="frequency" class="pnb-select" onchange="toggleCustomHours()">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="custom">Custom Hours</option>
                    </select>
                </div>
                <div class="mb-4 hidden" id="customHoursWrapper">
                    <label for="customHours" class="pnb-label">Interval (Hours)</label>
                    <input type="number" id="customHours" min="1" class="pnb-input" placeholder="24">
                </div>
                <div class="mb-4 flex items-center gap-3">
                    <input type="checkbox" id="startNow" class="w-4 h-4 cursor-pointer">
                    <label class="pnb-text-2 text-sm font-medium cursor-pointer" for="startNow">Run immediately on
                        save</label>
                </div>
                <div class="mb-6 flex items-center gap-3">
                    <input type="checkbox" id="notifyChange" class="w-4 h-4 cursor-pointer">
                    <label class="pnb-text-2 text-sm font-medium cursor-pointer" for="notifyChange">Notify on risk
                        score changes</label>
                </div>
                <button type="submit" class="pnb-btn pnb-btn-primary w-full">Schedule
                    Scan</button>
            </form>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="hidden pnb-modal-backdrop">
        <div class="pnb-modal-panel rounded-2xl max-w-2xl w-full max-h-[80vh] shadow-2xl flex flex-col">
            <div class="pnb-modal-header p-6 border-b flex justify-between items-center">
                <h2 class="text-xl font-bold"><span id="historyDomain"></span> History</h2>
                <button onclick="closeHistoryModal()" class="pnb-modal-close">&times;</button>
            </div>
            <div id="historyContent" class="overflow-y-auto p-6 divide-y">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script src="/js/schedules.js?v=2"></script>

    <!-- Qubitsense AI Agent Widget -->
    <link rel="stylesheet" href="/css/ai-agent.css?v=6">
    <script src="/components/sidebar.js"></script>
    <script src="/components/ai-agent.js?v=10"></script>

</body>

</html>
