<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Scans - Quantum Proof System Scanner</title>
    <meta name="description" content="View your scan history and monitor domains." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        white: '#1e293b', /* Invert all hardcoded white text to dark charcoal */
                        slate: { 50: '#0f172a', 100: '#1e293b', 300: '#334155', 400: '#475569', 500: '#64748b', 600: '#94a3b8', 700: '#cbd5e1', 800: '#f1f5f9', 900: '#ffffff', 950: '#f8fafc' },
                        gray: { 50: '#0f172a', 100: '#1e293b', 300: '#334155', 400: '#475569', 500: '#64748b', 600: '#94a3b8', 700: '#cbd5e1', 800: '#f1f5f9', 900: '#ffffff', 950: '#f8fafc' },
                        indigo: { 300: '#be123c', 400: '#e11d48', 500: '#a80024', 600: '#88001b' },
                        amber: { 400: '#f59e0b', 500: '#d97706' },
                        purple: { 600: '#88001b' } // Replace legacy background gradients with maroon
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/components/pnb-theme.css">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            background-image: url('/components/pnb_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #334155;
            min-height: 100vh;
        }

        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .risk-bar {
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, .08);
        }

        .risk-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .6s ease;
        }

        .risk-crit .risk-fill {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        .risk-high .risk-fill {
            background: linear-gradient(90deg, #f97316, #ea580c);
        }

        .risk-med .risk-fill {
            background: linear-gradient(90deg, #eab308, #ca8a04);
        }

        .risk-low .risk-fill {
            background: linear-gradient(90deg, #22c55e, #16a34a);
        }

        .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 9999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .badge-completed {
            background: rgba(34, 197, 94, .15);
            color: #4ade80;
        }

        .badge-running {
            background: rgba(59, 130, 246, .15);
            color: #60a5fa;
        }

        .badge-queued {
            background: rgba(234, 179, 8, .15);
            color: #facc15;
        }

        .badge-failed {
            background: rgba(239, 68, 68, .15);
            color: #f87171;
        }

        .badge-cached {
            background: rgba(139, 92, 246, .15);
            color: #a78bfa;
        }

        .monitor-on {
            color: #6366f1;
        }

        .monitor-off {
            color: #4b5563;
        }

        .scan-row:hover {
            background: rgba(99, 102, 241, .06);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn .3s ease both;
        }
    </style>
</head>

<body class="text-white">

    <!-- PNB Corporate Navigation -->
    <header class="relative z-20 border-b border-gray-700/50 bg-[#a80024] shadow-md" style="color: #ffffff;">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 w-1/3">
                <span class="text-2xl drop-shadow-md">🏦</span>
                <h1 class="font-extrabold text-lg tracking-tight whitespace-nowrap hidden md:block">Punjab National Bank
                    <span class="text-amber-400 font-medium px-2">—</span> Enterprise PQC Dashboard</h1>
                <h1 class="font-extrabold text-lg tracking-tight md:hidden">PNB Dashboard</h1>
            </div>

            <div class="flex justify-center w-1/3">
                <a href="/scanner"
                    class="text-xs font-bold text-amber-400 hover:text-white transition px-4 py-2 border border-amber-400/30 hover:bg-amber-400/10 rounded-md shadow-sm whitespace-nowrap">🏠
                    Back to Home</a>
            </div>

            <div class="flex items-center justify-end gap-4 w-1/3">
                <span id="userEmail" class="text-xs text-amber-100/70 hidden sm:block tracking-wide"></span>
                <button onclick="logout()"
                    class="px-4 py-1.5 rounded-lg bg-[#88001b] border border-red-900/50 text-red-100 text-sm hover:bg-red-900 transition shadow-inner">Logout</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8 mt-4">
            <div>
                <h1 class="text-3xl font-bold" style="color: #1e293b;">Your Inventory Scans</h1>
                <p class="text-sm text-gray-500 mt-1 font-medium tracking-wide">Domain scan history and monitoring
                    arrays</p>
            </div>
            <div class="flex items-center gap-4">
                <span id="scanCount" class="text-sm text-gray-500"></span>
                <a href="/scanner"
                    class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition shadow-lg shadow-indigo-500/20">
                    + New Scan
                </a>
            </div>
        </div>

        <!-- Scan List -->
        <div class="glass-card rounded-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-800 flex items-center justify-between">
                <h2 class="font-semibold text-white">Scan History</h2>
            </div>
            <div id="scanList" class="divide-y divide-gray-800/60">
                <div class="p-12 text-center text-gray-500">Loading scans...</div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="text-5xl mb-4 opacity-30">&#128270;</div>
            <h3 class="text-lg font-semibold text-gray-300 mb-2">No scans yet</h3>
            <p class="text-sm text-gray-500 mb-4">Start by scanning your first domain.</p>
            <a href="/scanner"
                class="inline-block px-6 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-sm font-semibold hover:shadow-lg hover:shadow-indigo-500/25 transition">Scan
                a Domain</a>
        </div>
    </main>

    <!-- Note Modal Overlay -->
    <div id="noteModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50"
        onclick="closeNoteModal()">
        <div class="glass-card w-full max-w-md rounded-2xl p-6 relative" onclick="event.stopPropagation()">
            <h3 class="text-lg font-semibold text-white mb-4">Scan Note</h3>
            <input type="hidden" id="noteScanId">
            <textarea id="noteContent" rows="5"
                class="w-full bg-gray-800/80 border border-gray-700 rounded-xl p-4 text-sm text-gray-300 focus:outline-none focus:border-indigo-500 resize-none mb-6 shadow-inner pointer-events-auto"
                placeholder="Write your findings here..."></textarea>

            <div class="flex items-center justify-between mt-2">
                <button onclick="clearAndSaveNote()"
                    class="text-sm text-red-500 hover:text-red-400 font-medium px-2 py-1 transition cursor-pointer">Delete
                    Note</button>
                <div class="flex gap-3">
                    <button onclick="closeNoteModal()"
                        class="px-5 py-2 rounded-lg bg-gray-800 border border-gray-700 hover:bg-gray-700 text-gray-300 text-sm font-medium transition cursor-pointer">Back</button>
                    <button onclick="saveNoteFromModal()"
                        class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition cursor-pointer">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const email = localStorage.getItem('email');

        if (!token) {
            window.location.href = '/login';
        }

        document.getElementById('userEmail').textContent = email || '';

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('email');
            localStorage.removeItem('user_id');
            window.location.href = '/login';
        }

        function riskClass(score) {
            if (score >= 75) return 'risk-crit';
            if (score >= 50) return 'risk-high';
            if (score >= 25) return 'risk-med';
            return 'risk-low';
        }

        function riskColor(score) {
            if (score >= 75) return '#ef4444';
            if (score >= 50) return '#f97316';
            if (score >= 25) return '#eab308';
            return '#22c55e';
        }

        async function toggleMonitor(domain, current) {
            try {
                await fetch(`/monitor/domain?domain=${encodeURIComponent(domain)}&monitored=${!current}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                loadScans();
            } catch (err) {
                console.error('Monitor toggle failed:', err);
            }
        }

        function renderScans(scans) {
            const list = document.getElementById('scanList');
            const empty = document.getElementById('emptyState');

            if (scans.length === 0) {
                list.parentElement.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            list.innerHTML = scans.map((s, i) => `
        <div class="scan-row flex items-center px-6 py-4 cursor-pointer transition fade-in" style="animation-delay:${i * 50}ms"
             onclick="window.location.href='/dashboard/${s.scan_id}'">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-3 mb-1">
              <span class="text-sm font-semibold text-slate-900" style="color: #4E0B11 !important; font-weight: 800;">${s.domain}</span>
              <span class="badge badge-${s.status}">${s.status}</span>
              ${s.monitored ? '<span class="badge" style="background:rgba(99,102,241,.15);color:#818cf8;">monitored</span>' : ''}
            </div>
            <div class="text-xs text-gray-500">Scan #${s.scan_id} &middot; ${new Date(s.created_at).toLocaleString()}</div>
          </div>
          <div class="flex items-center gap-6">
            <!-- Risk Bar -->
            <div class="w-32">
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-500">Risk</span>
                <span style="color:${riskColor(s.risk_score)}" class="font-semibold">${s.risk_score}</span>
              </div>
              <div class="risk-bar ${riskClass(s.risk_score)}">
                <div class="risk-fill" style="width:${s.risk_score}%"></div>
              </div>
            </div>
            <!-- Note Icon Button -->
            <button onclick="event.stopPropagation(); openNoteModal(${s.scan_id}, \`${(s.note || '').replace(/`/g, '\\`').replace(/\\/g, '\\\\')}\`)"
                    class="${s.note ? 'text-indigo-400 hover:text-indigo-300' : 'text-gray-500 hover:text-indigo-400'} transition text-lg mr-4" title="Take note">
              &#128221;
            </button>
            
            <!-- Monitor Checkbox -->
            <label class="flex items-center gap-2 cursor-pointer mr-2" onclick="event.stopPropagation()">
              <input type="checkbox" ${s.monitored ? 'checked' : ''} 
                     onchange="toggleMonitor('${s.domain}', ${s.monitored})"
                     class="w-4 h-4 rounded border-gray-600 text-indigo-500 bg-gray-700 focus:ring-indigo-500 cursor-pointer">
              <span class="text-xs text-gray-400 select-none">Monitored</span>
            </label>
            <!-- Delete Button -->
            <button onclick="event.stopPropagation(); deleteScan(${s.scan_id})"
              class="text-gray-600 hover:text-red-500 transition text-lg ml-2" title="Delete scan">
              &#128465;
            </button>
          </div>
        </div>
      `).join('');
        }

        function openNoteModal(scanId, currentNote) {
            document.getElementById('noteScanId').value = scanId;
            document.getElementById('noteContent').value = currentNote || '';
            document.getElementById('noteModal').classList.remove('hidden');
        }

        function closeNoteModal() {
            document.getElementById('noteModal').classList.add('hidden');
        }

        async function saveNoteFromModal() {
            const scanId = document.getElementById('noteScanId').value;
            const note = document.getElementById('noteContent').value;
            await saveNoteAPI(scanId, note);
            closeNoteModal();
            loadScans();
        }

        async function clearAndSaveNote() {
            const scanId = document.getElementById('noteScanId').value;
            await saveNoteAPI(scanId, '');
            closeNoteModal();
            loadScans();
        }

        async function saveNoteAPI(scanId, note) {
            try {
                await fetch(`/scan/${scanId}/note`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note })
                });
            } catch (err) {
                console.error('Failed to save note:', err);
            }
        }

        async function deleteScan(scanId) {
            if (!confirm(`Are you sure you want to permanently delete scan #${scanId}?`)) return;
            try {
                const res = await fetch(`/scan/${scanId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                if (res.ok) {
                    loadScans();
                } else {
                    const data = await res.json();
                    alert(data.detail || 'Failed to delete scan');
                }
            } catch (err) {
                console.error('Failed to delete scan:', err);
            }
        }

        async function loadScans() {
            try {
                const res = await fetch('/user/scans', {
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                if (res.status === 401) {
                    logout();
                    return;
                }
                const data = await res.json();
                renderScans(data.scans || []);
            } catch (err) {
                console.error('Failed to load scans:', err);
            }
        }

        loadScans();
    </script>
</body>

</html>
